<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NutriQuest</title>
<meta name="description" content="Dive into a magical microscopic world inside the human body. Follow nutrients on adventures, collect Molecule Pals and play science games.">
<meta name="theme-color" content="#8FD8F2">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-world="body">
<canvas id="ambient" class="ambient" aria-hidden="true"></canvas>
<div class="world-bg" aria-hidden="true"></div>
<header class="appbar">
  <div class="appbar-inner">
    <div id="header-left" class="header-left"></div>
    <span id="title" class="appbar-title">NutriQuest</span>
    <div id="counters" class="counters"></div>
  </div>
</header>
<nav id="tabs" class="tabs" aria-label="Sections"></nav>
<main id="main" tabindex="-1"></main>
<noscript><p style="padding:24px">NutriQuest needs JavaScript to run.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
